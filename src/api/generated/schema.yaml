          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCatalogoCupsRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoCups'
          description: ''
    delete:
      operationId: catalogo_cups_destroy
      description: 'Catálogos: lectura para todos los roles, escritura solo Administrador;
        borrado = desactivar.'
      parameters:
      - in: path
