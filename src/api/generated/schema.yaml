openapi: 3.0.3
info:
  title: HealthLab LIMS API
  version: 2.0.0
  description: 'API REST para la gestión de laboratorios clínicos de nivel I y II:
    pacientes, órdenes, muestras, resultados, validación, informes y captura de datos
    desde analizadores.'
paths:
  /api/v1/catalogo-cups/:
    get:
      operationId: catalogo_cups_list
      description: 'Catálogos: lectura para todos los roles, escritura solo Administrador;
        borrado = desactivar.'
      parameters:
      - in: query
        name: activo
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: El índice inicial a partir del cual devolver los resultados.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - catalogo-cups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogoCupsList'
          description: ''
    post:
      operationId: catalogo_cups_create
      description: 'Catálogos: lectura para todos los roles, escritura solo Administrador;
        borrado = desactivar.'
      tags:
      - catalogo-cups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogoCupsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatalogoCupsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatalogoCupsRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoCups'
          description: ''
  /api/v1/catalogo-cups/{id}/:
    get:
      operationId: catalogo_cups_retrieve
      description: 'Catálogos: lectura para todos los roles, escritura solo Administrador;
        borrado = desactivar.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este catalogo cups.
        required: true
      tags:
      - catalogo-cups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoCups'
          description: ''
    put:
      operationId: catalogo_cups_update
