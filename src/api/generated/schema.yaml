components:
  schemas:
    CambioContrasenaRequest:
      type: object
      properties:
        password_actual:
          type: string
          writeOnly: true
          minLength: 1
        password_nueva:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password_actual
      - password_nueva
    CatalogoCups:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        codigo_cups:
          type: string
          description: 'Ej: ''903895'''
          maxLength: 10
        descripcion:
          type: string
          maxLength: 255
        activo:
          type: boolean
      required:
      - codigo_cups
      - descripcion
      - id
    CatalogoCupsRequest:
      type: object
      properties:
        codigo_cups:
          type: string
          minLength: 1
          description: 'Ej: ''903895'''
          maxLength: 10
        descripcion:
          type: string
          minLength: 1
          maxLength: 255
        activo:
          type: boolean
      required:
      - codigo_cups
      - descripcion
    CausaExternaEnum:
      enum:
      - Accidente de trabajo
      - Accidente de transito
      - Accidente rabico
      - Accidente ofidico
      - Otro tipo de accidente
      - Evento catastrofico
      - Lesion por agresion
      - Lesion auto infligida
      - Sospecha maltrato fisico
      - Sospecha abuso sexual
      - Sospecha violencia sexual
      - Sospecha maltrato emocional
      - Enfermedad general
      - Enfermedad profesional
      - Otra
      type: string
      description: |-
        * `Accidente de trabajo` - Accidente de trabajo
        * `Accidente de transito` - Accidente de tránsito
        * `Accidente rabico` - Accidente rábico
        * `Accidente ofidico` - Accidente ofídico
        * `Otro tipo de accidente` - Otro tipo de accidente
        * `Evento catastrofico` - Evento catastrófico
        * `Lesion por agresion` - Lesión por agresión
        * `Lesion auto infligida` - Lesión auto infligida
        * `Sospecha maltrato fisico` - Sospecha maltrato físico
        * `Sospecha abuso sexual` - Sospecha abuso sexual
        * `Sospecha violencia sexual` - Sospecha violencia sexual
        * `Sospecha maltrato emocional` - Sospecha maltrato emocional
        * `Enfermedad general` - Enfermedad general
        * `Enfermedad profesional` - Enfermedad profesional
        * `Otra` - Otra
    CondicionMuestraEnum:
      enum:
      - Normal
      - Hemolizada
      - Lipemica
      - Icterica
      - Insuficiente
      - Coagulada
      - Contaminada
      type: string
      description: |-
        * `Normal` - Normal
        * `Hemolizada` - Hemolizada
        * `Lipemica` - Lipémica
        * `Icterica` - Ictérica
        * `Insuficiente` - Volumen insuficiente
        * `Coagulada` - Coagulada
        * `Contaminada` - Contaminada
    ConfiguracionEquipo:
      type: object
      description: 'El token nunca se devuelve: solo lo entrega `regenerar-token`
        (RF-13.3).'
